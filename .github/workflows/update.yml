name: Update PEGR Data

on:
  schedule:
    # 매일 UTC 22:10 (KST 07:10)
    - cron: '10 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test valuation engines
        run: |
          python -m unittest -v test_pegr.py
          node --check app.js
          node test_app.js

      - name: Generate and validate PEGR data
        run: |
          python gen_pegr_data.py
          python -m json.tool pegr_data.json >/dev/null

      - name: Commit and push changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pegr_data.json
          git diff --staged --quiet || git commit -m "chore: update pegr_data.json [$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')]"
          git push
